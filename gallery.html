<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Галерея · Health Diary</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f7f2;color:#203b2b;font:15px system-ui,-apple-system,sans-serif}main{max-width:1200px;margin:auto;padding:24px 20px 65px}h1{font-size:29px;margin:5px 0}h2{font-size:19px}.muted{color:#718777;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.nav{display:flex;gap:8px;align-items:center}button,.nav a{border:1px solid #c7ddcd;background:white;color:#203b2b;border-radius:9px;padding:10px 13px;cursor:pointer;font:inherit;text-decoration:none}.nav a:hover,button:hover{background:#e1f0e5}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:16px;margin-top:18px}.tile{overflow:hidden;border:1px solid #dce8df;background:white;border-radius:14px;padding:0;text-align:left}.tile img{width:100%;height:230px;object-fit:cover;display:block;background:#e5efe8}.tile .date{padding:11px 13px;background:#e1f0e5;font-weight:650;display:block}.tile .type{font-size:12px;color:#718777;display:block;padding:0 13px 11px}.overlay{position:fixed;inset:0;background:#11251bc9;display:flex;align-items:center;justify-content:center;padding:15px;z-index:100}.modal{background:#fff;border-radius:16px;width:min(1020px,100%);max-height:95vh;overflow:auto;padding:17px}.modal-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:12px}.modal-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,.75fr);gap:20px}.large-photo{background:#eff5f0;border-radius:9px;min-height:260px;display:flex;align-items:center;justify-content:center}.large-photo img{max-height:75vh;max-width:100%;object-fit:contain;border-radius:9px}.measures{display:grid;grid-template-columns:1fr auto;gap:9px;border-top:1px solid #dce8df;padding-top:13px}.measures b{text-align:right}.login{max-width:420px;background:white;margin:12vh auto;padding:20px;border-radius:14px}.login input{width:100%;padding:12px;border:1px solid #dce8df;border-radius:8px;margin:10px 0}.hidden{display:none!important}@media(max-width:700px){.modal-grid{grid-template-columns:1fr}.large-photo img{max-height:48vh}main{padding:14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile img{height:180px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.min.js"></script></head><body><main><div class="top"><div><div class="muted">Воскресный фотоархив</div><h1>Галерея прогресса</h1></div><div class="nav"><a href="./">Дневник</a><a href="./medical.html">Медосмотры</a><button id="out">Выйти</button></div></div><p class="muted" id="status">Подключение…</p><section id="login" class="login hidden"><h2>Войти</h2><p>Используй тот же email, что в дневнике.</p><input id="email" type="email" placeholder="Email"><div class="password-login"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password" style="width:100%;margin:10px 0;padding:11px;border:1px solid #c7ddcd;border-radius:8px"><button id="passwordLogin" type="button" class="primary">Войти с паролем</button></div><button id="send">Отправить ссылку</button><p id="loginmsg" class="muted"></p></section><section id="app" class="hidden"><div id="gallery" class="cards"></div></section></main><div id="overlay" class="overlay hidden"><div class="modal"><div class="modal-top"><b id="modalTitle"></b><button id="close">Закрыть ×</button></div><div class="modal-grid"><div class="large-photo"><img id="largeImage" alt="Фото прогресса"></div><div><h2>Замеры следующего понедельника</h2><div id="detailDate" class="muted"></div><div id="measureList" class="measures"></div></div></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),db=window.supabase.createClient('https://eqfklqcbemutyninqcid.supabase.co','sb_publishable_2xFw2pDkMd_QlQTn67OZWA_NmERmQHV'),bucket='progress-photos';let user=null,records={},lastUser='';const labels=[['weight','Вес','кг'],['neck','Шея','см'],['chest','Грудь','см'],['waist','Талия','см'],['hips','Бёдра','см'],['leftWrist','Левое запястье','см'],['rightWrist','Правое запястье','см'],['leftForearm','Левое предплечье','см'],['rightForearm','Правое предплечье','см'],['leftShoulder','Левое плечо','см'],['rightShoulder','Правое плечо','см'],['leftThigh','Левое бедро','см'],['rightThigh','Правое бедро','см'],['leftCalf','Левая икра','см'],['rightCalf','Правая икра','см'],['leftAnkle','Левая щиколотка','см'],['rightAnkle','Правая щиколотка','см']];function mondayAfter(d){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+1);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}function pretty(d){return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}function status(t){$('status').textContent=t}
async function showPhoto(item){$('overlay').classList.remove('hidden');$('modalTitle').textContent=(item.kind==='portrait'?'Портрет':'В полный рост')+' · '+pretty(item.day);$('largeImage').src=item.url;let next=mondayAfter(item.day);$('detailDate').textContent=pretty(next);let host=$('measureList');host.replaceChildren();let data=records[next]||{},count=0;for(let [key,name,unit] of labels){if(data[key]===undefined||data[key]==='')continue;let title=document.createElement('span');title.textContent=name;let value=document.createElement('b');value.textContent=data[key]+' '+unit;host.append(title,value);count++}if(!count){let n=document.createElement('p');n.className='muted';n.textContent='Для этого понедельника пока нет веса или замеров.';host.replaceWith(host.cloneNode(false));$('measureList').append(n)}}async function load(){status('Загрузка фотографий…');let r=await db.from('diary_entries').select('day,data').limit(10000);if(r.error){status('Ошибка: '+r.error.message);return}records={};for(let x of r.data)records[x.day]=x.data||{};let photos=[];let list=await db.storage.from(bucket).list(user.id,{limit:1000});if(list.error){status('Ошибка галереи: '+list.error.message);return}let folders=(list.data||[]).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.name)).sort((a,b)=>b.name.localeCompare(a.name));for(let folder of folders){let d=folder.name,files=await db.storage.from(bucket).list(user.id+'/'+d,{limit:20});if(files.error)continue;for(let kind of ['portrait','full'])if(files.data?.some(x=>x.name===kind)){let path=user.id+'/'+d+'/'+kind;let url=await db.storage.from(bucket).createSignedUrl(path,3600);if(!url.error)photos.push({day:d,kind,url:url.data.signedUrl})}}const host=$('gallery');host.replaceChildren();for(let photo of photos){let card=document.createElement('button');card.className='tile';let img=document.createElement('img');img.src=photo.url;img.loading='lazy';img.alt=photo.kind==='portrait'?'Портрет':'В полный рост';let date=document.createElement('span');date.className='date';date.textContent=pretty(photo.day);let type=document.createElement('span');type.className='type';type.textContent=photo.kind==='portrait'?'Портрет':'В полный рост';card.append(img,date,type);card.onclick=()=>showPhoto(photo);host.append(card)}if(!photos.length){let p=document.createElement('p');p.className='muted';p.textContent='Воскресных фотографий пока нет. Загрузи их в дневнике, выбрав воскресенье.';host.append(p)}status('Фотографий: '+photos.length)}
$('close').onclick=()=>$('overlay').classList.add('hidden');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.add('hidden')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('overlay').classList.add('hidden')});$('out').onclick=()=>db.auth.signOut();$('passwordLogin').onclick=async()=>{let email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('loginmsg').textContent='Введи email и пароль';return}$('loginmsg').textContent='Проверка…';let {error}=await db.auth.signInWithPassword({email,password});$('loginmsg').textContent=error?'Не удалось войти: '+error.message:''};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('passwordLogin').click()});$('send').onclick=async()=>{let email=$('email').value.trim();if(!email)return;let x=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('loginmsg').textContent=x.error?x.error.message:'Ссылка отправлена'};async function auth(){let {data:{user:u}}=await db.auth.getUser();user=u;$('login').classList.toggle('hidden',!!u);$('app').classList.toggle('hidden',!u);if(u&&lastUser!==u.id){lastUser=u.id;await load()}else if(!u){lastUser='';status('Войди, чтобы открыть галерею')}}db.auth.onAuthStateChange(()=>setTimeout(auth,0));auth()})();
</script></body></html>
