<!doctype html><html lang="ru"><meta charset="utf-8"><title>Пароль дневника</title><body><h1>Установить пароль</h1><p>Введи одноразовый код из панели Supabase и новый пароль (не менее 12 символов).</p><form id="f"><input id="c" required placeholder="Одноразовый код"><input id="p" required type="password" minlength="12" placeholder="Новый пароль"><button>Сохранить пароль</button></form><p id="msg"></p><a href="./">Дневник</a><script>document.getElementById('f').onsubmit=async(e)=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Проверка…';try{const res=await fetch('https://eqfklqcbemutyninqcid.supabase.co/functions/v1/set-diary-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('c').value,password:document.getElementById('p').value})});const json=await res.json();msg.textContent=json.message||'Ошибка';}catch(err){msg.textContent=err.message}};</script></body></html>
