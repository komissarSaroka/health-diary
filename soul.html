<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Душа · Health Diary</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f5;color:#282d31;font:15px system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:20px}h1{font-size:29px;margin:0}h2{font-size:18px;margin:0 0 15px}.top,.nav,.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.nav a,button{font:inherit;color:inherit;background:#fff;border:1px solid #cbd1d5;border-radius:9px;padding:9px 12px;text-decoration:none;cursor:pointer}button:hover,.nav a:hover{background:#eceeef}.card{background:white;border:1px solid #dfe3e6;border-radius:16px;padding:18px;min-width:0}.upper{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;align-items:start}.lower{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:13px}.thoughts{margin-top:13px}input,textarea{width:100%;font:inherit;color:inherit;border:1px solid #d7dce0;border-radius:9px;background:#fff;padding:10px;outline:none}input:focus,textarea:focus{border-color:#f05443}textarea{min-height:160px;resize:vertical;line-height:1.55}.moods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.mood{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid transparent;background:transparent;padding:6px 0;border-radius:10px;min-width:0}.mood svg{width:100%;max-width:49px;height:auto}.mood small{font-size:10px;white-space:normal;overflow-wrap:anywhere;text-align:center;line-height:1.15}.mood.active{border-color:#f05443;background:#fff4f1}.energy-row{display:flex;gap:6px;margin-bottom:8px}.energy-row button{flex:0 0 29px;padding:0;color:#969da3;border:0;background:transparent;font-size:20px}.add{font-size:13px;color:#666d73;padding:8px 10px}.date{font-size:16px;font-weight:650;margin:12px 0}.muted{color:#747c83;font-size:13px}.hidden{display:none!important}#status{min-height:18px;margin:8px 0}.cal-head{margin-bottom:15px}.cal-head h2{margin:0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}.calendar button{height:40px;padding:0;border:1px solid transparent;background:#f3f4f5;font-weight:600}.calendar button.chosen{outline:2px solid #525b62;outline-offset:-2px}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px;font-size:11px;color:#747c83}.legend span{display:inline-flex;gap:4px;align-items:center}.legend i{width:13px;height:13px;border-radius:3px}.placeholder{min-height:220px}.login{max-width:420px;margin:40px auto}.login input{margin:8px 0}.login button{margin:4px 4px 0 0}@media(max-width:750px){.upper{grid-template-columns:1fr}.lower{grid-template-columns:1fr}main{padding:13px}.moods{max-width:360px}.mood small{font-size:12px}.placeholder{min-height:120px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.min.js"></script></head><body><main><div class="top"><h1>Душа</h1><nav class="nav"><a href="./">Дневник</a><a href="./medical.html">Медосмотры</a><a href="./gallery.html">Галерея</a><a href="./lists.html">Списки</a><button id="out">Выйти</button></nav></div><p class="muted" id="status" role="status"></p><section id="login" class="card login hidden"><h2>Войти</h2><input id="email" type="email" placeholder="Email" autocomplete="email"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button id="signIn">Войти</button><button id="send">Ссылка на email</button><p id="message" class="muted"></p></section><section id="app" class="hidden"><div id="dateTitle" class="date"></div><div class="upper"><section class="card"><h2>Общее настроение</h2><div id="moods" class="moods"></div></section><section class="card"><h2>Подарило энергию</h2><div id="energy_gained"></div><button class="add" id="gainAdd">+ Добавить</button></section><section class="card"><h2>Отняло энергию</h2><div id="energy_lost"></div><button class="add" id="lostAdd">+ Добавить</button></section></div><section class="card thoughts"><h2>Мысли и наблюдения за день</h2><textarea id="thoughts" placeholder="Что сегодня было важным?"></textarea></section><div class="lower"><section class="card"><div class="cal-head"><button id="prev" aria-label="Предыдущий месяц">‹</button><h2 id="month"></h2><button id="next" aria-label="Следующий месяц">›</button></div><div id="calendar" class="calendar"></div><div id="legend" class="legend"></div></section><section class="card placeholder"><h2>Показатели</h2></section></div></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const db=window.supabase.createClient('https://eqfklqcbemutyninqcid.supabase.co','sb_publishable_2xFw2pDkMd_QlQTn67OZWA_NmERmQHV');
const moods=[{key:'good',label:'Радость',color:'#fddbd5',mouth:'M17 27 Q25 37 33 27'},{key:'neutral',label:'Ничего',color:'#f9b6ac',mouth:'M18 30 H32'},{key:'mixed',label:'Все',color:'#f58273',mouth:'M17 29 Q21 23 25 29 T33 29'},{key:'sad',label:'Грусть',color:'#f05443',mouth:'M17 34 Q25 24 33 34'}];
const fmt=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const parse=d=>new Date(d+'T12:00:00');let day=fmt(new Date()),month=new Date(new Date().getFullYear(),new Date().getMonth(),1),user=null,ready=false,entries={},queue=Promise.resolve(),authBusy=false;
const fresh=()=>({mood:null,energy_gained:['','',''],energy_lost:['','',''],thoughts:''});
function record(){return entries[day]||(entries[day]=fresh())}
function status(s){$('status').textContent=s}
function save(key,value){if(!user||!ready)return;const r=record();r[key]=value;const date=day,uid=user.id,data={user_id:uid,day:date,mood:r.mood,energy_gained:r.energy_gained,energy_lost:r.energy_lost,thoughts:r.thoughts};const snapshot=JSON.parse(JSON.stringify(data));status('Сохранение…');queue=queue.catch(()=>{}).then(async()=>{const {error}=await db.from('soul_entries').upsert(snapshot,{onConflict:'user_id,day'});if(error)throw error;status('Сохранено')}).catch(e=>status('Ошибка сохранения: '+e.message))}
function renderMoods(){const root=$('moods');root.replaceChildren();for(const m of moods){const b=document.createElement('button');b.type='button';b.className='mood'+(record().mood===m.key?' active':'');b.setAttribute('aria-pressed',String(record().mood===m.key));b.innerHTML='<svg viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="23" fill="'+m.color+'"/><g fill="#65352e"><circle cx="18" cy="20" r="2.2"/><circle cx="32" cy="20" r="2.2"/></g><path d="'+m.mouth+'" fill="none" stroke="#65352e" stroke-width="2.5" stroke-linecap="round"/></svg><small>'+m.label+'</small>';b.onclick=()=>{save('mood',m.key);renderMoods();calendar()};root.append(b)}}
function renderEnergy(key){const host=$(key);host.replaceChildren();const r=record();const values=Array.isArray(r[key])?[...r[key]]:[];while(values.length<3)values.push('');r[key]=values;values.forEach((value,i)=>{const row=document.createElement('div');row.className='energy-row';const input=document.createElement('input');input.value=value;input.placeholder='Пункт '+(i+1);input.setAttribute('aria-label',(key==='energy_gained'?'Подарило':'Отняло')+' энергию — пункт '+(i+1));input.oninput=()=>{const list=[...record()[key]];list[i]=input.value;save(key,list)};row.append(input);if(i>=3){const del=document.createElement('button');del.type='button';del.textContent='×';del.setAttribute('aria-label','Удалить пункт');del.onclick=()=>{const list=[...record()[key]];list.splice(i,1);save(key,list);renderEnergy(key)};row.append(del)}host.append(row)})}
function addEnergy(key){const list=[...record()[key],''];save(key,list);renderEnergy(key);$(key).lastElementChild?.querySelector('input')?.focus()}
function calendar(){const root=$('calendar');root.replaceChildren();const y=month.getFullYear(),m=month.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,count=new Date(y,m+1,0).getDate();$('month').textContent=month.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});for(const d of ['Пн','Вт','Ср','Чт','Пт','Сб','Вс']){const x=document.createElement('span');x.className='muted';x.textContent=d;root.append(x)}for(let i=0;i<offset;i++)root.append(document.createElement('span'));for(let i=1;i<=count;i++){const date=fmt(new Date(y,m,i)),b=document.createElement('button'),mood=moods.find(x=>x.key===entries[date]?.mood);b.textContent=i;if(mood){b.style.background=mood.color;b.style.color=mood.key==='sad'?'#fff':'#65352e'}b.classList.toggle('chosen',date===day);b.title=date+(mood?' — '+mood.label:'');b.onclick=()=>{day=date;render()};root.append(b)}}
function render(){const r=record();$('dateTitle').textContent=parse(day).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});renderMoods();renderEnergy('energy_gained');renderEnergy('energy_lost');$('thoughts').value=r.thoughts||'';calendar()}
$('thoughts').oninput=e=>save('thoughts',e.target.value);$('gainAdd').onclick=()=>addEnergy('energy_gained');$('lostAdd').onclick=()=>addEnergy('energy_lost');$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);calendar()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);calendar()};
for(const m of [...moods].sort((a,b)=>['good','neutral','mixed','sad'].indexOf(a.key)-['good','neutral','mixed','sad'].indexOf(b.key))){const span=document.createElement('span'),swatch=document.createElement('i');swatch.style.background=m.color;span.append(swatch,document.createTextNode(m.label));$('legend').append(span)}
async function auth(){if(authBusy)return;authBusy=true;try{const {data,error}=await db.auth.getSession();if(error)throw error;const u=data?.session?.user||null;if(u&&user?.id===u.id&&ready)return;ready=false;user=u;$('login').classList.toggle('hidden',!!u);$('app').classList.add('hidden');if(!u){entries={};status('');return}status('Загрузка…');const result=await db.from('soul_entries').select('day,mood,energy_gained,energy_lost,thoughts').eq('user_id',u.id);if(result.error)throw result.error;entries={};for(const r of result.data||[])entries[r.day]=r;ready=true;$('app').classList.remove('hidden');render();status('')}catch(e){status('Ошибка: '+e.message)}finally{authBusy=false}}
$('out').onclick=async()=>{await queue;await db.auth.signOut()};$('signIn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('message').textContent=error?error.message:''};$('password').onkeydown=e=>{if(e.key==='Enter')$('signIn').click()};$('send').onclick=async()=>{const {error}=await db.auth.signInWithOtp({email:$('email').value.trim(),options:{emailRedirectTo:location.origin+location.pathname}});$('message').textContent=error?error.message:'Проверь email'};db.auth.onAuthStateChange(()=>setTimeout(auth,0));auth()})();
</script></body></html>
