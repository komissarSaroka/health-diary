const silence=rows.reduce((sum,r)=>sum+(Number(r.techniques?.silenceMinutes)||0),0);const moodDays=rows.filter(r=>r.mood).length;
for(const [value,label] of [[rows.filter(r=>r.mood==='good').length+' / '+moodDays,'Радость · отмеченные дни'],[avg('anxiety'),'Средняя тревожность'],[avg('energy'),'Средняя энергия'],[silence+' мин','В тишине']]){const box=document.createElement('div');box.className='week-stat';const strong=document.createElement('strong');strong.textContent=value;const span=document.createElement('span');span.textContent=label;box.append(strong,span);stats.append(box)}
const energy=$('weekEnergy');energy.replaceChildren();for(const [key,label] of [['energy_gained','Чаще дарило энергию'],['energy_lost','Чаще отнимало энергию']]){const section=document.createElement('div'),h=document.createElement('h3');h.textContent=label;section.append(h);const counts=new Map();for(const r of rows){const seen=new Set();for(const value of r[key]||[]){const text=String(value).trim(),k=text.toLocaleLowerCase('ru');if(!k||seen.has(k))continue;seen.add(k);const prior=counts.get(k)||{text,count:0};prior.count++;counts.set(k,prior)}}const sorted=[...counts.values()].sort((a,b)=>b.count-a.count).slice(0,5);for(const item of sorted){const p=document.createElement('p');p.textContent=item.text+' — '+item.count+' дн.';section.append(p)}if(!sorted.length){const p=document.createElement('p');p.className='muted';p.textContent='Нет записей';section.append(p)}energy.append(section)}}
function render(){const r=record();$('dateTitle').textContent=parse(day).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});renderMoods();renderTechniques();renderEmotions();renderWeekSummary();renderEnergy('energy_gained');renderEnergy('energy_lost');$('thoughts').value=r.thoughts||'';calendar();renderDayPhoto()}
$('thoughts').oninput=e=>save('thoughts',e.target.value);$('gainAdd').onclick=()=>addEnergy('energy_gained');$('lostAdd').onclick=()=>addEnergy('energy_lost');$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);calendar()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);calendar()};
for(const m of [...moods].sort((a,b)=>['good','neutral','mixed','sad'].indexOf(a.key)-['good','neutral','mixed','sad'].indexOf(b.key))){const span=document.createElement('span'),swatch=document.createElement('i');swatch.style.background=m.color;span.append(swatch,document.createTextNode(m.label));$('legend').append(span)}
async function auth(){if(authBusy)return;authBusy=true;try{const {data,error}=await db.auth.getSession();if(error)throw error;const u=data?.session?.user||null;if(u&&user?.id===u.id&&ready)return;ready=false;user=u;$('login').classList.toggle('hidden',!!u);$('app').classList.add('hidden');if(!u){entries={};status('');return}status('Загрузка…');const result=await db.from('soul_entries').select('day,mood,energy_gained,energy_lost,thoughts,techniques,emotional_state').eq('user_id',u.id);if(result.error)throw result.error;entries={};for(const r of result.data||[])entries[r.day]=r;ready=true;$('app').classList.remove('hidden');render();status('')}catch(e){status('Ошибка: '+e.message)}finally{authBusy=false}}
$('out').onclick=async()=>{await queue;await db.auth.signOut()};$('signIn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('message').textContent=error?error.message:''};$('password').onkeydown=e=>{if(e.key==='Enter')$('signIn').click()};$('send').onclick=async()=>{const {error}=await db.auth.signInWithOtp({email:$('email').value.trim(),options:{emailRedirectTo:location.origin+location.pathname}});$('message').textContent=error?error.message:'Проверь email'};db.auth.onAuthStateChange(()=>setTimeout(auth,0));auth()})();
</script></body></html>
